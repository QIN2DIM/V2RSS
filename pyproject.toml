[tool.poetry]
name = "python-project"
version = "0.1.0"
description = "A Python project with testing infrastructure"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
fire = ">=0.4.0"
requests = ">=2.26.0"
telethon = ">=1.24.0"
sanic = ">=21.12.0"
bs4 = ">=0.0.1"
beautifulsoup4 = ">=4.10.0"
cloudscraper = ">=1.2.58"
selenium = ">=4.1.0"
pillow = ">=8.4.0"
pydub = ">=0.25.1"
colorama = ">=0.4.4"
pytz = ">=2021.3"
pyyaml = ">=6.0"
loguru = ">=0.5.3"
gevent = ">=21.8.0"
tqdm = ">=4.62.3"
apscheduler = ">=3.8.1"
playwright = ">=1.17.2"
redis = ">=4.0.1"
SpeechRecognition = "==3.8.1"
webdriver_manager = "==3.5.2"
undetected_chromedriver = "==3.1.5.post4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take a long time to run",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/setup.py",
    "*/conf.py",
    "*/.venv/*",
    "*/venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"